name: Validate profiles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Fails if any file generated by scripts/build.py is stale, a catalog
      # entry is malformed, a profile breaks the title/heading/size rules, or
      # two profiles share too much verbatim text. Standard library only.
      - name: Validate profiles and registries
        run: python3 scripts/validate.py
